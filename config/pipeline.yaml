# ==============================================================================
# Kyberna — Parâmetros Globais do Pipeline de Dados e Algoritmos
# ==============================================================================

pipeline:
  version: "1.0.0"

# Reprodutibilidade e sementes pseudo-aleatórias determinísticas
seeds:
  faker: 42
  sampling: 42
  train_test_split: 42

# Janela histórica padrão da ingestão da base pública Iowa Liquor Sales
ingestion:
  socrata_domain: "data.iowa.gov"
  socrata_dataset_id: "m3tr-qhgy"
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  page_size: 50000
  sample_rows_limit: 10000

# Parâmetros analíticos e regras de negócio
thresholds:
  # Classificação Curva ABC (Margem de Contribuição Líquida ou Receita Bruta)
  abc_metric: "contribution_margin"  # Opções: "contribution_margin" (padrão Kyberna) ou "gross_revenue"
  abc_a_cutoff: 0.80   # Top 80% acumulado -> Classe A
  abc_b_cutoff: 0.95   # 80% a 95% acumulado -> Classe B; > 95% -> Classe C

  # Classificação Volatilidade XYZ (Coeficiente de Variação semanal - CV)
  xyz_x_cutoff: 0.50   # CV <= 0.50 -> Alta previsibilidade (X)
  xyz_y_cutoff: 1.00   # 0.50 < CV <= 1.00 -> Previsibilidade moderada (Y); > 1.00 ou inativo -> Errada/Esporádica (Z)

  # Políticas Prescritivas por Célula da Matriz 3x3 ABC/XYZ
  abc_xyz_policies:
    AX: "Ruptura zero / Estoque de segurança alto e ressuprimento contínuo (JIT)"
    AY: "Estoque de segurança moderado / Atenção a picos sazonais e campanhas"
    AZ: "Estoque de segurança sob medida / Produção puxada ou sob encomenda flexível"
    BX: "Ressuprimento automático / Ponto de pedido fixo e lote econômico"
    BY: "Revisão periódica / Gestão padrão por ponto de pedido"
    BZ: "Estoque mínimo / Reposição por lote econômico ou sob demanda"
    CX: "Estoque enxuto / Compras programadas e automatizadas em lote padrão"
    CY: "Estoque mínimo / Compra em lotes pequenos apenas com giro garantido"
    CZ: "Sob encomenda ou descontinuar / Liquidar estoque excedente"

  # Critérios de Risco de Churn e Inatividade
  churn_inactivity_days: 120    # Clientes sem compra há mais de 120 dias

  # Segmentação RFM B2B (Recência, Frequência, Margem de Contribuição)
  rfm:
    recency_metric: "recency_days"
    frequency_metric: "frequency"
    monetary_metric: "contribution_margin"  # Princípio Kyberna: Margem acima de Volume
    quantiles: 5
    segments:
      champions:
        name: "Campeões"
        description: "Clientes mais valiosos: compram com alta frequência, recência recente e geram a maior margem líquida."
        action: "Tratamento VIP, acesso antecipado a lançamentos, bonificação de mix e canal direto com diretoria."
      cant_lose:
        name: "Não Pode Perder"
        description: "Clientes de altíssima rentabilidade e histórico consistente que estão se distanciando (risco crítico)."
        action: "Visita imediata da gerência comercial / diretoria, diagnóstico de insatisfação e renegociação personalizada de condições."
      loyal:
        name: "Fiéis"
        description: "Base sólida da carteira: compram regularmente com rentabilidade saudável e boa frequência."
        action: "Programas de fidelidade, incentivos de cross-sell (White Space) e manutenção de relacionamento próximo."
      promising:
        name: "Promissores"
        description: "Compradores recentes com boa margem unitária/ticket, mas baixa frequência histórica."
        action: "Estimular o segundo e terceiro pedidos com ofertas personalizadas de famílias complementares."
      new_customers:
        name: "Novos Clientes"
        description: "Primeira compra faturada recentemente; início do ciclo de relacionamento."
        action: "Onboarding assistido pelo RCA, pesquisa de satisfação pós-venda e catálogo completo de produtos."
      at_risk:
        name: "Em Risco"
        description: "Clientes que compravam com boa frequência, mas cujo intervalo sem compras excedeu o esperado."
        action: "Contato proativo do RCA com tabela de ofertas de reativação e apuração de motivos de afastamento."
      need_attention:
        name: "Precisam de Atenção"
        description: "Clientes intermediários com recência e frequência medianas; correm o risco de esfriar."
        action: "Apresentação de novidades do catálogo, condições facilitadas de frete e sugestões de abastecimento."
      hibernating:
        name: "Hibernando"
        description: "Baixa frequência e longa inatividade, mas com histórico anterior de compras."
        action: "Campanhas sazonais de reativação via WhatsApp, saldões promocionais e recontato comercial."
      lost:
        name: "Perdidos"
        description: "Piores indicadores: compra única distante no passado e margem líquida residual ou negativa."
        action: "Comunicação automatizada de baixo custo ou exclusão de roteiros presenciais de visitação."

  # Análise de Estoque e Capital de Giro
  excess_inventory_days: 120    # Estoque parado acima de 120 dias de cobertura
  min_stock_coverage_days: 15   # Nível de alerta de ruptura (dias de venda média)

  # Janela de Previsão de Demanda
  forecast_horizon_days: 30     # Horizonte padrão de previsão estatística
