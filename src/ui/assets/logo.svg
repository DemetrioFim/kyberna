<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 76" width="265" height="76">
  <defs>
    <linearGradient id="helmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F7A8C" />
      <stop offset="100%" stop-color="#0F4C5C" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>

  <!-- Leme Náutico Estilizado (Kyberna: Governar / Pilotar) -->
  <g transform="translate(40, 38)">
    <!-- Outer Spoke Handles (8 Pegadores) -->
    <line x1="0" y1="-28" x2="0" y2="-35" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="25" y2="-25" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="0" x2="35" y2="0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="20" x2="25" y2="25" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="0" y2="35" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="20" x2="-25" y2="25" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="-28" y1="0" x2="-35" y2="0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="-20" x2="-25" y2="-25" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />

    <!-- Aro Externo -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#helmGradient)" stroke-width="4.5" />

    <!-- Aro Interno de Destaque -->
    <circle cx="0" cy="0" r="15.5" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="2, 2" opacity="0.8" />

    <!-- Raios Internos -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="url(#helmGradient)" stroke-width="2.5" />
    <line x1="-25" y1="0" x2="25" y2="0" stroke="url(#helmGradient)" stroke-width="2.5" />
    <line x1="-17.7" y1="-17.7" x2="17.7" y2="17.7" stroke="url(#helmGradient)" stroke-width="2" />
    <line x1="-17.7" y1="17.7" x2="17.7" y2="-17.7" stroke="url(#helmGradient)" stroke-width="2" />

    <!-- Cubo Central (Hub) -->
    <circle cx="0" cy="0" r="8" fill="url(#goldGradient)" />
    <circle cx="0" cy="0" r="4" fill="#0F172A" />
  </g>

  <!-- Wordmark VIRTUS -->
  <text x="90" y="43" font-family="'Inter', -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="4.5" fill="#1F7A8C">VIRTUS</text>

  <!-- Subtítulo BY KYBERNA -->
  <text x="92" y="59" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#C9A227">BY KYBERNA</text>
</svg>
