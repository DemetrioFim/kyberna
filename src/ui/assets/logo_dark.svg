<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="helmGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Leme Náutico Estilizado (Kyberna: Governar / Pilotar) -->
  <g transform="translate(42, 40)">
    <!-- Outer Spoke Handles (8 Pegadores) -->
    <line x1="0" y1="-28" x2="0" y2="-36" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="25" y2="-25" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="0" x2="36" y2="0" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="20" x2="25" y2="25" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="0" y2="36" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="20" x2="-25" y2="25" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="-28" y1="0" x2="-36" y2="0" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="-20" x2="-25" y2="-25" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />

    <!-- Aro Externo -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#helmGradientDark)" stroke-width="4.5" />

    <!-- Aro Interno de Destaque -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="2, 2" opacity="0.8" />

    <!-- Raios Internos -->
    <line x1="0" y1="-26" x2="0" y2="26" stroke="url(#helmGradientDark)" stroke-width="2.5" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="url(#helmGradientDark)" stroke-width="2.5" />
    <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="url(#helmGradientDark)" stroke-width="2" />
    <line x1="-18.4" y1="18.4" x2="18.4" y2="-18.4" stroke="url(#helmGradientDark)" stroke-width="2" />

    <!-- Cubo Central (Hub) -->
    <circle cx="0" cy="0" r="8" fill="url(#goldGradientDark)" />
    <circle cx="0" cy="0" r="4" fill="#0D131D" />
  </g>

  <!-- Wordmark KYBERNA -->
  <text x="96" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="3.5" fill="#38BDF8">
    KYBERNA
  </text>

  <!-- Subtítulo DECISION INTELLIGENCE -->
  <text x="98" y="58" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" letter-spacing="2.5" fill="#FBBF24">
    DECISION INTELLIGENCE
  </text>
</svg>
