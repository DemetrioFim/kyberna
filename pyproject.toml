[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyberna"
version = "0.1.0"
description = "Kyberna — Decision Intelligence & Prescriptive Analytics para PMEs e indústrias brasileiras"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Kyberna Team", email = "contato@kyberna.com.br" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "pyodbc>=5.1.0",
    "azure-identity>=1.16.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
etl = [
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "faker>=25.0.0",
    "pandera>=0.20.0",
    "xlsxwriter>=3.2.0",
]
ml = [
    "statsforecast>=1.7.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
]
app = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
    "pandas-stubs>=2.2.0",
]

[project.scripts]
kyberna = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "notebooks",
    "data",
    "models",
    "docs",
    "*.md",
]


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PL",   # Pylint
    "NPY",  # NumPy-specific rules
    "RUF",  # Ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLC0415", # Allow imports in tests functions if needed
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert
]


[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = [
    "statsforecast.*",
    "lightgbm.*",
    "sklearn.*",
    "scipy.*",
    "faker.*",
    "pandera.*",
    "xlsxwriter.*",
    "pyodbc.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: Testes que demoram mais de alguns segundos",
    "azure: Testes que exigem conexão ou infraestrutura Azure",
    "ui: Testes da interface Streamlit",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
